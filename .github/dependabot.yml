version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its types must always move together: bumping react-dom without
      # react leaves two React copies in the tree and the studio fails to render.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      web-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
