name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the daemon boots
        run: |
          node apps/daemon/src/index.ts &
          DAEMON_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:9861/api/health > /tmp/health.json; then
              cat /tmp/health.json
              kill $DAEMON_PID
              exit 0
            fi
            sleep 0.5
          done
          kill $DAEMON_PID || true
          echo "the daemon did not become healthy" >&2
          exit 1

  container:
    name: Daemon image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: open-creator-ai:ci
